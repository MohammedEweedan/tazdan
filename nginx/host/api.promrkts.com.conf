# Hardened HOST-level nginx config for the droplet (systemd nginx, NOT the
# containerised one — see docker-compose.prod.yml notes).
#
# Install:
#   scp nginx/host/api.promrkts.com.conf root@<droplet>:/etc/nginx/sites-available/api.promrkts.com
#   ln -sf /etc/nginx/sites-available/api.promrkts.com /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# The limit_req zone must live in http context — sites-enabled files are
# included inside http{}, so declaring it here is valid.

limit_req_zone $binary_remote_addr zone=api_perip:10m rate=20r/s;
limit_req_status 429;

server {
  listen 80;
  server_name api.promrkts.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  server_name api.promrkts.com;

  ssl_certificate     /etc/letsencrypt/live/api.promrkts.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.promrkts.com/privkey.pem;

  # TLS policy: 1.2 minimum, modern AEAD ciphers only.
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # HSTS — 2 years, all subdomains. `always` attaches it to error responses.
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  server_tokens off;

  # Host nginx proxies the published container port on loopback.
  # (Inside a container this would be wrong — but this file is for the HOST.)

  location /socket.io/ {
    limit_req zone=api_perip burst=20 nodelay;
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
  }

  location /api/ {
    limit_req zone=api_perip burst=40 nodelay;
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 10m;
  }

  # The api. subdomain auto-prefixes /api so clients may omit it.
  location / {
    limit_req zone=api_perip burst=40 nodelay;
    rewrite ^/(.*)$ /api/$1 break;
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 10m;
  }
}
