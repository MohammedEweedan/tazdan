upstream promrkts_api {
  server server:5000;
  keepalive 32;
}

# Edge rate limiting — first line of defense before requests ever reach
# Node. The app-level limiters (Redis-backed) are the precise layer; this
# zone just sheds floods cheaply. 10MB zone ≈ 160k tracked IPs.
limit_req_zone $binary_remote_addr zone=api_perip:10m rate=20r/s;
limit_req_status 429;

# The marketing site (promrkts.com) is served by Vercel, not the droplet — only
# api.promrkts.com points here. So nginx on the droplet only proxies the API.

server {
  listen 80;
  server_name api.promrkts.com _;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
    listen 443 ssl http2;
    server_name api.promrkts.com;

    ssl_certificate /etc/letsencrypt/live/api.promrkts.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.promrkts.com/privkey.pem;

    # TLS policy: 1.2 minimum, modern AEAD ciphers only.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS — browsers refuse plaintext for this host for 2 years.
    # `always` so it's attached to error responses too.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Don't advertise the nginx version.
    server_tokens off;

    # Proxy to the API container over the docker network (NOT 127.0.0.1 — that
    # is nginx's own loopback inside its container and never reaches the server).
    location /socket.io/ {
        # Long-lived connections: a modest burst, no rate cap on frames
        # (limit_req counts HTTP requests, not websocket messages).
        limit_req zone=api_perip burst=20 nodelay;
        proxy_pass http://promrkts_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        limit_req zone=api_perip burst=40 nodelay;
        proxy_pass http://promrkts_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }

    # The api. subdomain auto-prefixes /api so clients may omit it.
    location / {
        limit_req zone=api_perip burst=40 nodelay;
        rewrite ^/(.*)$ /api/$1 break;
        proxy_pass http://promrkts_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }
}
