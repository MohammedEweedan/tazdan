# HTTP → HTTPS redirect + ACME challenge
server {
  listen 80;
  server_name promrkts.com www.promrkts.com api.promrkts.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# API / WebSocket backend (api.promrkts.com)
server {
  listen 443 ssl http2;
  server_name api.promrkts.com;

  ssl_certificate     /etc/letsencrypt/live/promrkts.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/promrkts.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

  client_max_body_size 10m;

  # Webhook endpoints — higher rate limit, no buffering
  location ~ ^/api/deposits/webhook/ {
    limit_req zone=webhooks burst=20 nodelay;
    proxy_pass http://server:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;  # raw body must reach Express unchanged
  }

  location ~ ^/api/(auth/login|auth/register) {
    limit_req zone=auth burst=5 nodelay;
    proxy_pass http://server:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Socket.io upgrade
  location /socket.io/ {
    proxy_pass http://server:5000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
  }

  location / {
    limit_req zone=general burst=30 nodelay;
    proxy_pass http://server:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# Next.js client (promrkts.com)
server {
  listen 443 ssl http2;
  server_name promrkts.com www.promrkts.com;

  ssl_certificate     /etc/letsencrypt/live/promrkts.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/promrkts.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

  # Redirect www → apex
  if ($host = www.promrkts.com) {
    return 301 https://promrkts.com$request_uri;
  }

  location / {
    limit_req zone=general burst=60 nodelay;
    proxy_pass http://client:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
