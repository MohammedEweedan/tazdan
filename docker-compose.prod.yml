services:
  redis:
    image: redis:7-alpine
    container_name: tazdan-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env} --save 60 1 --loglevel warning
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    networks:
      - app

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: tazdan-server
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 5000
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379
      CLUSTER_WORKERS: ${CLUSTER_WORKERS:-1}
      CLIENT_URL: ${CLIENT_URL:-https://promrkts.com,https://www.promrkts.com}
    ports:
      - '5000:5000'
    volumes:
      - uploads:/app/uploads
    networks:
      - app

  # NOTE: the marketing/web client is hosted on Vercel — it is intentionally
  # NOT built or run on the droplet. The droplet only runs the API (+ redis +
  # nginx). This keeps deploys lightweight and fast (no Next.js build here).

  nginx:
    image: nginx:1.27-alpine
    container_name: tazdan-nginx
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
    networks:
      - app

  certbot:
    image: certbot/certbot:latest
    container_name: tazdan-certbot
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"

networks:
  app:
    driver: bridge

volumes:
  redisdata:
  uploads:
  certbot-www:
  certbot-certs:
