services:
  redis:
    image: redis:7-alpine
    container_name: tazdan-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env} --save 60 1 --loglevel warning
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    networks:
      - app

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: tazdan-server
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 5000
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379
      CLUSTER_WORKERS: ${CLUSTER_WORKERS:-1}
      CLIENT_URL: ${CLIENT_URL:-https://promrkts.com,https://www.promrkts.com}
      REAL_MONEY_ENABLED: ${REAL_MONEY_ENABLED:-0}
      CUSTODY_MODE: ${CUSTODY_MODE:-disabled}
      LAUNCH_EVIDENCE_PATH: /run/launch-evidence/manifest.json
    # Loopback only: host nginx proxies api.promrkts.com → 127.0.0.1:5000.
    # Publishing on 0.0.0.0 would let clients skip nginx (TLS, rate limits)
    # and spoof X-Forwarded-For past the IP limits and admin allowlist —
    # Docker-published ports bypass UFW, so the firewall would not stop it.
    ports:
      - '127.0.0.1:5000:5000'
    volumes:
      - uploads:/app/uploads
      - ./private-launch-evidence:/run/launch-evidence:ro
    networks:
      - app

  # Nightly DB backups with rotation (default 14 days). Dumps land in the
  # `dbbackups` volume; set BACKUP_S3_URI (+ AWS creds) in .env to also copy
  # offsite — a droplet loss must not take the backups with it.
  # Manual run / restore drill:
  #   docker compose -f docker-compose.prod.yml run --rm backup sh /backup.sh
  backup:
    build:
      context: ./scripts
      dockerfile: backup/Dockerfile
    container_name: tazdan-backup
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      BACKUP_S3_URI: ${BACKUP_S3_URI:?Set an offsite backup destination}
      BACKUP_REQUIRE_OFFSITE: '1'
      BACKUP_RETAIN_DAYS: ${BACKUP_RETAIN_DAYS:-14}
      AWS_ACCESS_KEY_ID: ${BACKUP_AWS_ACCESS_KEY_ID:?Set dedicated backup credentials}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_AWS_SECRET_ACCESS_KEY:?Set dedicated backup credentials}
      AWS_REGION: ${BACKUP_AWS_REGION:-eu-central-1}
      AWS_ENDPOINT_URL: ${BACKUP_AWS_ENDPOINT_URL:-}
    volumes:
      - dbbackups:/backups
      - uploads:/uploads:ro
    # Sleep-loop cron: runs once on start (so every deploy proves the backup
    # path still works), then every 24h. The image includes the pinned-lock
    # application script and AWS CLI; startup never installs packages.
    # For DO Spaces also set AWS_ENDPOINT_URL (e.g. https://fra1.digitaloceanspaces.com).
    healthcheck:
      test: ['CMD-SHELL', 'test ! -e /backups/latest-failure && test -s /backups/latest-success && test $$(($$(date +%s) - $$(cat /backups/latest-success))) -lt 108000']
      interval: 5m
      timeout: 10s
      start_period: 10m
      retries: 1
    networks:
      - app

  # NOTE: the marketing/web client is hosted on Vercel — NOT built or run here.
  #
  # TLS termination + reverse proxy is handled by a HOST-level nginx (systemd)
  # on the droplet, which owns ports 80/443 and proxies api.promrkts.com →
  # 127.0.0.1:5000 (this server's published port). A containerised nginx would
  # collide on those ports, so there is intentionally no nginx/certbot service
  # here. Host nginx config + certs live at /etc/nginx and /etc/letsencrypt on
  # the host — the HARDENED reference config to apply there is
  # nginx/host/api.promrkts.com.conf in this repo. The droplet stack is:
  # redis + server + backup.

networks:
  app:
    driver: bridge

volumes:
  redisdata:
  uploads:
  dbbackups:
