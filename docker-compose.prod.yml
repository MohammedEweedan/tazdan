# Production compose. Requires a .env file at project root with all secrets.
# Bring up: docker compose -f docker-compose.prod.yml up -d
# First deploy: docker compose -f docker-compose.prod.yml exec server npx prisma migrate deploy

services:
  redis:
    image: redis:7-alpine
    container_name: promrkts-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --save 60 1 --loglevel warning
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: promrkts-server
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 5000
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    volumes:
      - uploads:/app/uploads
    networks:
      - internal

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: promrkts-client
    restart: unless-stopped
    depends_on:
      - server
    env_file: .env
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://${DOMAIN}/api
      NEXT_PUBLIC_WS_URL: https://${DOMAIN}
    networks:
      - internal

  nginx:
    image: nginx:1.27-alpine
    container_name: promrkts-nginx
    restart: unless-stopped
    depends_on:
      - server
      - client
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
    networks:
      - internal
      - external

  certbot:
    image: certbot/certbot:latest
    container_name: promrkts-certbot
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"

networks:
  internal:
    driver: bridge
    internal: true
  external:
    driver: bridge

volumes:
  redisdata:
  uploads:
  certbot-www:
  certbot-certs:
