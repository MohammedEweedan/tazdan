services:
  redis:
    image: redis:7-alpine
    container_name: tazdan-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env} --save 60 1 --loglevel warning
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    networks:
      - app

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: tazdan-server
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 5000
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379
      CLUSTER_WORKERS: ${CLUSTER_WORKERS:-1}
      CLIENT_URL: ${CLIENT_URL:-https://promrkts.com,https://www.promrkts.com}
    ports:
      - '5000:5000'
    volumes:
      - uploads:/app/uploads
    networks:
      - app

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: tazdan-client
    restart: unless-stopped
    depends_on:
      - server
    env_file: .env
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.promrkts.com/api}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-https://api.promrkts.com}
      # Server-side route handlers (e.g. /api/waitlist) reach the backend over
      # the internal Docker network — never the public domain, which fails on
      # hairpin-NAT from inside the droplet and silently drops signups.
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://server:5000}
    networks:
      - app

  nginx:
    image: nginx:1.27-alpine
    container_name: tazdan-nginx
    restart: unless-stopped
    depends_on:
      - server
      - client
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
    networks:
      - app

  certbot:
    image: certbot/certbot:latest
    container_name: tazdan-certbot
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"

networks:
  app:
    driver: bridge

volumes:
  redisdata:
  uploads:
  certbot-www:
  certbot-certs:
