version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: promrkts-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-promrkts}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-promrkts_secret}
      POSTGRES_DB: ${POSTGRES_DB:-promrkts}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-promrkts}']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: promrkts-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: promrkts-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-promrkts}:${POSTGRES_PASSWORD:-promrkts_secret}@postgres:5432/${POSTGRES_DB:-promrkts}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_me_refresh_in_production}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
      RATE_LIMIT_WINDOW_MS: '900000'
      RATE_LIMIT_MAX: '100'
    ports:
      - '5000:5000'
    volumes:
      - uploads:/app/uploads

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: promrkts-client
    restart: unless-stopped
    depends_on:
      - server
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000/api}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost:5000}
    ports:
      - '3000:3000'

volumes:
  pgdata:
  redisdata:
  uploads:
